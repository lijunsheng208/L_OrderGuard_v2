name: orderguard-v2

x-go-service: &go-service
  restart: unless-stopped
  environment:
    HTTP_ADDR: ":8080"
    DATABASE_URL: "postgres://orderguard:orderguard@postgres:5432/orderguard?sslmode=disable"
    REDIS_ADDR: "redis:6379"
    ORDER_SERVICE_URL: "http://order-service:8080"
    PAYMENT_SERVICE_URL: "http://payment-service:8080"
    INVENTORY_SERVICE_URL: "http://inventory-service:8080"
    BUSINESS_MCP_URL: "http://business-mcp:8080/mcp"
    OBSERVABILITY_MCP_URL: "http://observability-mcp:8080/mcp"
    KNOWLEDGE_MCP_URL: "http://knowledge-mcp:8080/mcp"
    REMEDIATION_MCP_URL: "http://remediation-mcp:8080/mcp"
    AGENT_API_KEY: "${AGENT_API_KEY:-}"
    AGENT_BASE_URL: "${AGENT_BASE_URL:-}"
    AGENT_MODEL: "${AGENT_MODEL:-}"
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 2s
    retries: 12

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orderguard
      POSTGRES_USER: orderguard
      POSTGRES_PASSWORD: orderguard
    volumes:
      - postgres-data:/var/lib/postgresql
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderguard -d orderguard"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["${REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: orderguard
      PGUSER: orderguard
      PGPASSWORD: orderguard
    volumes:
      - ../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        for file in /migrations/orders/*.sql /migrations/payments/*.sql /migrations/inventory/*.sql /migrations/observability/*.sql /migrations/mcp/*.sql /migrations/agent/*.sql; do
          psql -v ON_ERROR_STOP=1 -f "$$file"
        done

  order-service:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: services/order}
    ports: ["8081:8080"]

  payment-service:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: services/payment}
    ports: ["8082:8080"]

  inventory-service:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: services/inventory}
    ports: ["8083:8080"]

  reconciliation-service:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: services/reconciliation}
    ports: ["8084:8080"]

  business-mcp:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: mcp/business}
    ports: ["8091:8080"]

  observability-mcp:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: mcp/observability}
    ports: ["8092:8080"]

  knowledge-mcp:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: mcp/knowledge}
    ports: ["8093:8080"]

  remediation-mcp:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: mcp/remediation}
    ports: ["8094:8080"]

  agent-runtime:
    <<: *go-service
    build:
      context: ..
      args: {TARGET: services/agent-runtime}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      business-mcp:
        condition: service_healthy
      observability-mcp:
        condition: service_healthy
      knowledge-mcp:
        condition: service_healthy
    ports: ["8090:8080"]

volumes:
  postgres-data:
  redis-data:
